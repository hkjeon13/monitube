[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitube-api"
version = "0.1.0"
description = "Quota-safe YouTube collection API scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "konlpy>=0.6.0,<0.7",
    "mecab-python3>=1.0.10,<2.0",
    "nltk>=3.9,<4.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "redis>=5.0,<7.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.15,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["monitube_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../worker"]
addopts = "-q"
