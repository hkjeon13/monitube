# Values reproduce what is running in monitube-prod today, read from the live
# cluster on 2026-08-20. Change deliberately: this chart is the source of truth
# for a release whose original tarball is no longer in the chart repository.

nameOverride: monitube

images:
  web: {repository: 192.168.219.103:30500/monitube/web, tag: compose-e87fa8b43341}
  api: {repository: 192.168.219.103:30500/monitube/api-rust, tag: compose-6c1b1e36b735}
  tokenizer: {repository: 192.168.219.103:30500/monitube/tokenizer, tag: compose-ab1f738008a7}
  collectionWorker: {repository: 192.168.219.103:30500/monitube/collection-worker-rust, tag: compose-8bee727e0691}
  nlpWorker: {repository: 192.168.219.103:30500/monitube/nlp-worker-rust, tag: compose-87d06f6b43aa}
  analysisWorker: {repository: 192.168.219.103:30500/monitube/analysis-worker-rust, tag: compose-6aaf42ec3e5a}
  migrate: {repository: 192.168.219.103:30500/monitube/migrate, tag: latest}
  postgres: {repository: postgres, tag: 16-alpine}
  redis: {repository: redis, tag: 7-alpine}

pullPolicy: IfNotPresent
pullSecrets:
  - name: devtron-local-registry-pull

secrets:
  # Carries the legacy DATABASE_URL and every other runtime variable. Central
  # mode overrides only DATABASE_URL from database.central.secretName.
  runtime: monitube-runtime-env
  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD for the legacy StatefulSet.
  # CNPG also reads POSTGRES_PASSWORD from it to authenticate the import.
  database: monitube-postgres-auth

replicas:
  web: 1
  api: 1
  tokenizer: 1
  collectionWorker: 1
  nlpWorker: 1
  analysisWorker: 1

service:
  type: NodePort
  nodePort: 30086

# The running release binds these on the node loopback. Nothing in the chart
# depends on them, but they are reproduced so an upgrade does not silently
# remove a binding something on the node may still use.
hostPorts:
  enabled: true
  hostIP: 127.0.0.1
  web: 13000
  api: 18000

database:
  # legacy keeps the current runtime Secret and is the production default.
  # central makes API/workers/migration read a Monitube-specific Secret in the
  # monitube-prod namespace. It never references a Secret across namespaces.
  # This is the cutover switch; leave it at legacy through rehearsal/parity.
  mode: legacy
  central:
    # Provisioned outside this chart from the central database credential
    # workflow. It must include uri, host, port, dbname, username, password.
    # Do not put credentials into this values file.
    secretName: monitube-central-db
    uriKey: uri
    hostKey: host
    portKey: port
    databaseKey: dbname
    usernameKey: username
    passwordKey: password

# The postgres:16-alpine StatefulSet that currently holds the data.
# Keep it enabled through the migration. It is the rollback path, and CNPG
# imports from it. Disable only once the CNPG cluster is verified and soaked.
legacyPostgres:
  enabled: true
  existingClaim: monitube-postgres
  # Recovery PV backed by the retained Compose volume after the old
  # dynamically-provisioned PVC was deleted during the v0.2.0 upgrade.
  # Keep this explicit static binding until CNPG has completed its import.
  storageClass: monitube-recovery
  volumeName: monitube-postgres-recovery
  recoveryHostPath: /var/lib/docker/volumes/monitube_postgres_data/_data
  size: 100Gi
  # Verify against the live secret before trusting these for the CNPG import:
  #   kubectl -n monitube-prod get secret monitube-postgres-auth \
  #     -o jsonpath='{.data.POSTGRES_USER}' | base64 -d
  user: monitube
  database: monitube
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 8Gi}
  # Leave this false in normal legacy operation. Turning it on changes
  # wal_level, which requires a PostgreSQL restart; use it only for the
  # separately approved logical-replication rehearsal/cutover window.
  logicalReplication:
    enabled: false
    maxReplicationSlots: 10
    maxWalSenders: 10

cnpg:
  # Kept only for the older dedicated-Cluster chart path. It is not the
  # central database migration target; central mode does not create a Cluster.
  enabled: false
  name: monitube-db
  # Single-node k3s cluster (mobichat-k3s-1). More than one instance buys no
  # availability here and doubles local disk use.
  instances: 1
  # House image, matching central-pg-data and ai-assistant-logs. It is
  # PostgreSQL 17 while the legacy StatefulSet is 16 — the import handles the
  # major-version jump, but see the runbook before relying on it.
  image: 192.168.219.103:30500/cnpg-pg17-pgvector:17.11-0.8.2
  storageClass: database-local-retain
  size: 100Gi
  walStorage:
    enabled: true
    storageClass: database-local-retain
    size: 32Gi
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 8Gi}
  # Runs pg_dump/pg_restore from the legacy service at first boot. Set to false
  # only to provision an empty cluster.
  importFromLegacy: true
  parameters:
    max_connections: "60"
    shared_buffers: 2GB
    effective_cache_size: 6GB
    work_mem: 8MB
    maintenance_work_mem: 512MB
    autovacuum_work_mem: 256MB
    random_page_cost: "1.1"
    effective_io_concurrency: "200"
    max_wal_size: 4GB
    checkpoint_completion_target: "0.9"
    wal_compression: "on"
    track_io_timing: "on"
    idle_in_transaction_session_timeout: 30s
    log_min_duration_statement: 500ms
    log_temp_files: 64MB
    # Keep both at 0 so query parameters never reach the logs.
    log_parameter_max_length: "0"
    log_parameter_max_length_on_error: "0"

redis:
  enabled: true
  maxmemory: 512mb
  maxmemoryPolicy: allkeys-lru

# Applies database/migrations through scripts/apply_migrations.sh as a Helm
# hook. Disabled to match the running release; enable once the migrate image
# is confirmed to carry migration 025.
migration:
  enabled: false
  backoffLimit: 1
